    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Villa Smooth Scrolling Frames</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: #111;
            color: #eee;
            font: 16px/1.5 system-ui, sans-serif
        }

        header {
            padding: 24px;
            text-align: center
        }

        header h1 {
            margin: 0 0 8px;
            font-size: clamp(22px, 4vw, 38px)
        }

        header p {
            color: #aaa;
            margin: 0
        }

        .gallery {
            max-width: 1000px;
            margin: auto;
            padding: 12px 20px 60px
        }

        .frame {
            margin: 0 0 28px;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px #0008;
            opacity: 0;
            transform: translateY(35px);
            animation: reveal .8s ease forwards
        }

        .frame img {
            display: block;
            width: 100%;
            height: auto
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .frame:nth-child(3n) {
            animation-delay: .08s
        }

        .frame:nth-child(3n+1) {
            animation-delay: .16s
        }

        @media(prefers-reduced-motion:reduce) {
            .frame {
                animation: none;
                opacity: 1;
                transform: none
            }
        }
    </style>
</head>

        <p>Frame-by-frame smooth scroll animation · Scroll down to explore</p>
